[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:postgres]
command=/bin/bash -lc 'exec "$(pg_config --bindir)/postgres" -D /var/lib/nusaerp/postgres -c listen_addresses=127.0.0.1 -c port=5432'
user=postgres
autostart=true
autorestart=true
startsecs=3
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:backend]
command=/bin/bash /opt/nusaerp/container/start-backend.sh
autostart=true
autorestart=true
startsecs=5
startretries=10
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:n8n]
command=/usr/local/bin/n8n start
user=node
environment=HOME="/var/lib/nusaerp/n8n",N8N_USER_FOLDER="/var/lib/nusaerp/n8n"
autostart=true
autorestart=true
startsecs=10
startretries=10
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:cloudflared]
command=/bin/bash /opt/nusaerp/container/start-cloudflared.sh
autostart=true
autorestart=false
startsecs=0
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0